# Test-wide configuration. Merged over src/main/resources/application.yml rather
# than replacing it: Spring Boot loads application.properties and application.yml
# from the same location and lets .properties win on any key both set. A test
# application.yml would have shadowed the main one entirely and taken the datasource
# and Kafka configuration with it, which is why this file is .properties.

# The confirmation watcher's timer is off unless a test asks for it.
#
# This is a default rather than an annotation, and the difference is the whole point.
# chain.rpc-url is http://localhost:8545, which on a developer's machine is whatever
# `docker compose up` left running — so with the timer on, every integration test in
# the module polls a real Ethereum node every two seconds. Nothing failed because of
# it: the only test with a BROADCAST withdrawal uses a transaction hash no chain has
# ever seen. But that is luck rather than design, and it is precisely the hazard
# @WithoutKafka documents for the broker — "a test whose result depends on something
# outside the repository is not a test".
#
# An opt-out annotation was the other option, matching @WithoutKafka. It was rejected
# because it has the same hole this is fixing: the sixteen test classes that reach the
# node today are the ones that did not think to add it, and a seventeenth would not
# either. Defaulting to off means a test has to say out loud that it wants a
# background thread talking to the outside world.
#
# Tests that do want it turn it back on with
# @TestPropertySource(properties = "chain.watcher.scheduled=true") — see
# ConfirmationSchedulingTest, which is the only one, because it is the only test whose
# subject is the timer.
chain.watcher.scheduled=false

# A small connection pool per test context, because there are a lot of contexts.
#
# Spring's TestContext framework caches a context per distinct configuration and keeps
# every one of them alive for the whole run, so the pools are all open at once. At
# Hikari's default of 10 that is comfortably past the shared container's
# max_connections of 100, and the failure is not subtle: whichever context happens to
# start last fails to run Flyway with "sorry, too many clients already", and the test
# that owns it looks broken.
#
# Four is generous for a test that runs on one thread. The exception is the ledger's
# fifty-thread concurrency tests, which queue for a connection instead of getting one
# each — that is fine, because what they are contending for is a row lock rather than
# a socket, and serialising the approach to it does not weaken the race they set up.
spring.datasource.hikari.maximum-pool-size=4
