spring:
  application:
    name: custody-api

  datasource:
    url: jdbc:postgresql://localhost:5432/custody
    username: postgres
    password: postgres

  jpa:
    # Never let Hibernate create or alter tables. Flyway owns the schema;
    # `validate` only checks that the entities match what Flyway built, and
    # fails fast at startup if they have drifted.
    hibernate:
      ddl-auto: validate
    # Close the persistence context at the end of the service call rather than
    # the end of the HTTP request. Keeps lazy loading (and N+1 queries) out of
    # the web layer, where you cannot see them.
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # acks=all: the broker only acknowledges once every in-sync replica has
      # the message. With idempotence on, producer retries cannot create
      # duplicates. Both are the default in recent Spring Kafka, set explicitly
      # because it is a decision, not an accident.
      acks: all
      properties:
        enable.idempotence: true
      # Strings both ways, and the JSON is built by EventJson rather than by a
      # serialiser. See KafkaConfig for why: the outbox already holds the payload
      # as text, and a second Jackson configuration is a second set of bytes for
      # M3's signatures to disagree with.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # The group id is also the `consumer` column in processed_events. The
      # constant that keeps them in step is SigningResultListener.CONSUMER.
      group-id: custody-api
      # A new group reads the topic from the beginning rather than skipping
      # whatever arrived before it first connected. For results that are applied
      # idempotently this is the safe direction: re-reading old events is free,
      # and missing one leaves a withdrawal stuck.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /readiness, which is what
      # Kubernetes probes use: liveness = restart me, readiness = don't route to me.
      probes:
        enabled: true

ledger:
  # pessimistic = SELECT ... FOR UPDATE, optimistic = version check with retry.
  # Both are implemented and both are tested; see docs/adr/0001 for why this is
  # the default. Switching it changes only which BalanceUpdater bean is created.
  locking: pessimistic
  # How many times LedgerService re-runs a posting that lost an optimistic race
  # before giving up. Dead weight under pessimistic locking, which never loses.
  max-attempts: 50

outbox:
  relay:
    # The timer. Off in tests that drive the relay themselves, so they can assert
    # on one batch instead of sleeping and hoping.
    scheduled: true
    # A latency budget, not a throughput one: it decides how long an approved
    # withdrawal waits before the signer hears about it. A tick that finds
    # nothing costs one query against the partial index on unpublished rows.
    poll-interval: 500ms
    # How many rows one transaction claims. The rows are locked for the duration
    # of the sends, so this is the knob that trades latency against lock time.
    batch-size: 100
    # How long to wait for the broker to acknowledge one message before giving up
    # on the batch and leaving the rest for the next tick. Bounded, because
    # Kafka's own delivery.timeout.ms defaults to two minutes and a relay
    # transaction should not hold row locks for two minutes.
    ack-timeout: 5s

approvals:
  # Four eyes from 1 ETH up; one approver below it. A rule expensive enough to be
  # routinely worked around protects nothing, so the expensive rule is kept for the
  # amounts that justify it.
  #
  # This is the same number as `signer.policy.second-approval-from-wei`, and the
  # duplication is the security model rather than an oversight: this service
  # enforces the quorum before it publishes, and the signer enforces it again from
  # its own configuration before it signs. If the signer trusted this count,
  # owning this service would be enough to move funds. See ApprovalProperties for
  # what happens when the two are set to different numbers.
  second-approval-from-wei: "1000000000000000000" # 1 ETH

# Our own configuration, bound to a @ConfigurationProperties class later.
chain:
  rpc-url: http://localhost:8545
  chain-id: 31337
  confirmations: 3
