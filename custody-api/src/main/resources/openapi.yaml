# The contract, and the source of the Java interfaces the controllers implement.
#
# This file is written before the code, not extracted from it. That ordering is
# the whole point of "API-first": a contract that is generated from annotations
# can only ever describe what was built, so it cannot be reviewed before it is
# built, and a consumer cannot start against it. Here the Gradle build runs
# `openApiGenerate` before `compileJava`, produces one interface per tag, and the
# controllers implement them — so the implementation cannot drift from the
# contract without failing to compile.
#
# OpenAPI 3.0.3 rather than 3.1: the generator's 3.1 support still has rough
# edges around nullable types, and nothing here needs a 3.1 feature.
openapi: 3.0.3

info:
  title: mini-custody
  version: "1.0.0"
  description: |
    Custody of ETH: clients hold balances in a double-entry ledger, request
    withdrawals, and approvers sign them off before an isolated signer service
    puts a transaction on chain.

    **Amounts are strings, always.** A JSON number is an IEEE 754 double in most
    parsers, which loses precision above 2^53. One ETH is 10^18 wei, so every
    amount in this API would be wrong. They are decimal integer strings in wei.

    **There is no authentication yet.** This is a learning project; in production
    every endpoint below would sit behind mTLS or OAuth and the client identity
    would come from the credential rather than from the account being named in
    the body.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: withdrawals
    description: Requesting withdrawals and following their state.
  - name: approvals
    description: |
      Four-eyes sign-off on a withdrawal. Its own tag rather than part of
      `withdrawals`, for the reason `dev-withdrawals` is separate: `useTags`
      generates one interface per tag and one controller implements each, and two
      controllers cannot implement the same interface without mapping the same
      path twice. The operation is about a withdrawal but the code that decides it
      is the approval package's.
  - name: accounts
    description: Reading ledger balances.
  - name: reconciliation
    description: |
      Comparing what the ledger says happened on chain with what the chain says.
      Its own tag because `useTags` generates one interface per tag and one
      controller implements each, and this one belongs next to the confirmation
      watcher whose work it is checking.
  - name: clients
    description: Per-client configuration, starting with the destination whitelist.
  - name: dev
    description: |
      Only mapped under the `dev` Spring profile. These endpoints fabricate state
      that would otherwise come from the chain, so that the withdrawal flow can be
      exercised locally without waiting for a real deposit.
  - name: dev-withdrawals
    description: |
      The same `dev` profile, kept as its own tag because `useTags` generates one
      interface per tag and one controller implements each: these operations act
      on withdrawals and belong next to the withdrawal code, not next to the
      ledger's simulated deposits.
  - name: dev-approvers
    description: |
      The same `dev` profile again, and its own tag for the same reason: seeding
      the approver registry belongs next to the approval code. Unlike the other
      two, what this stands in for is not a chain event but an onboarding process
      — approvers are people, and in a real deployment they do not arrive over
      HTTP.

paths:
  /v1/withdrawals:
    post:
      tags: [withdrawals]
      operationId: requestWithdrawal
      summary: Request a withdrawal
      description: |
        Accepts the request, holds the funds, and returns immediately. The
        withdrawal is not sent yet: it has to collect approvals, be signed, be
        broadcast and be confirmed, which takes minutes. Hence `202` and a
        `Location` header rather than a `201` — poll `GET /v1/withdrawals/{id}`.

        Funds are held (moved from the client's account to `PENDING_OUT`) at
        request time, not at send time. Two concurrent requests against the same
        balance therefore cannot both succeed: the second one sees the money
        already gone and fails with `INSUFFICIENT_FUNDS`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
      responses:
        '202':
          description: |
            Accepted, funds held. Also returned for a retry of a request that was
            already accepted: the same key with the same body is the same
            withdrawal, not a second one.
          headers:
            Location:
              description: Where to poll for the current state.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: |
            The idempotency key has been used before for a *different* request.
            Reusing a key with new contents is a client bug, and guessing which
            of the two was meant is not the server's place.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/LedgerBusy'

  /v1/withdrawals/{withdrawalId}:
    get:
      tags: [withdrawals]
      operationId: getWithdrawal
      summary: Current state of a withdrawal
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/withdrawals/{withdrawalId}/approvals:
    post:
      tags: [approvals]
      operationId: approveWithdrawal
      summary: Record one approver's sign-off
      description: |
        Four eyes. An approver signs a statement of what they are agreeing to —
        the withdrawal id, the destination and the amount — and posts the
        signature here. The server rebuilds that statement from its own record of
        the withdrawal and verifies the signature against the approver's
        registered public key, so a signature over terms the caller chose cannot
        be recorded against a withdrawal with different ones.

        The statement is the canonical JSON of:

        ```json
        {"amountWei":"400000000000000000","destination":"0x7099…79c8","withdrawalId":"…"}
        ```

        Canonical means keys sorted, no whitespace, amounts as decimal strings.
        Both this service and the signer recompute those bytes rather than
        trusting any that travel, because the payload is stored as `jsonb` on the
        way through and Postgres does not preserve `jsonb` byte for byte.

        How many approvers an amount needs is configuration: two at or above one
        ETH, one below it. When the last one arrives the withdrawal moves to
        `APPROVED` and the `WithdrawalApproved` event is written to the outbox in
        the same transaction — so the response saying `collected == required` and
        the signer being told are one atomic fact rather than two.

        The quorum is enforced again by the signer, from its own configuration and
        against its own list of trusted keys. Compromising this service is
        therefore not enough to move funds.
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '201':
          description: |
            The approval is recorded. Compare `collected` with `required`, or read
            `status`, to see whether it was the one that completed the quorum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Either this approver has already approved this withdrawal
            (`ALREADY_APPROVED`), or the withdrawal is no longer waiting for
            approval (`ILLEGAL_STATE_TRANSITION`). Neither is a retry that can be
            made to succeed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The approval cannot be accepted: the approver is not registered
            (`UNKNOWN_APPROVER`), the signature is not theirs over this withdrawal
            (`INVALID_APPROVAL_SIGNATURE`), or they act for the client whose money
            this is (`SELF_APPROVAL`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/accounts/{accountId}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Balance of a ledger account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/reconciliation:
    get:
      tags: [reconciliation]
      operationId: reconcile
      summary: Compare the ledger against the chain
      description: |
        Runs the reconciliation and returns what it found. Reads only — nothing
        here repairs anything, because every finding has more than one possible
        cause and the right remedy depends on which. The ledger is append-only, so
        a repair is a reversing entry made by somebody who has looked.

        Synchronous, and it makes one JSON-RPC call per settled or in-flight
        withdrawal, so at real volume this would be a scheduled job writing to a
        report rather than a request anybody waits on. It is an endpoint here
        because being able to ask the question by hand is what makes the property
        demonstrable.

        `hotWalletBalanceWei` is information, not a check. It cannot be reconciled
        in this system: deposits are fabricated by `POST /dev/deposits` rather than
        observed on chain, because nothing here watches for incoming transfers. A
        balance check that failed on every run would train everybody to ignore the
        report.
      responses:
        '200':
          description: |
            The run completed. An empty `discrepancies` with `confirmedChecked` of
            zero means nothing has settled yet, which is not the same as agreement
            — the counts are there so the two can be told apart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
        '502':
          description: |
            The chain could not be reached, so the question was not answered. A
            `502` rather than a `200` with an empty report: "the node did not
            reply" must never read as "the chain agrees".
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/clients/{clientId}/whitelist:
    post:
      tags: [clients]
      operationId: whitelistAddress
      summary: Allow a destination address for this client
      description: |
        A withdrawal may only go to an address on this list. The list is the
        control that makes a compromised API client survivable: an attacker who
        can call this API can still only move funds to somewhere the client
        already declared, and adding an address is the slow, reviewable step.

        Adding an address that is already listed succeeds and changes nothing.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhitelistRequest'
      responses:
        '201':
          description: The address is now whitelisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhitelistEntry'
        '400':
          $ref: '#/components/responses/BadRequest'

  /dev/deposits:
    post:
      tags: [dev]
      operationId: simulateDeposit
      summary: Credit a client account, as an on-chain deposit would
      description: |
        Books `EXTERNAL -amount / CLIENT +amount`, creating the client's account
        if this is their first deposit. Mapped only under the `dev` profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Deposit booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'

  /dev/approvers:
    post:
      tags: [dev-approvers]
      operationId: registerApprover
      summary: Register an approver and their public key
      description: |
        Adds a row to the approver registry, which is what
        `POST /v1/withdrawals/{id}/approvals` verifies signatures against.

        In a real deployment approvers arrive through whatever process onboards a
        person who can authorise payments — an identity provider, a ceremony, a
        change request with two signatures on it — and never through an
        unauthenticated HTTP call. This endpoint exists so the local walk-through
        in the README can generate a key pair and use it, and it is mapped only
        under the `dev` profile: the bean is not created otherwise and the path
        returns `404`.

        Note what registering an approver here does **not** do. The signer keeps
        its own list of trusted keys in configuration and never reads this table,
        so an approver added here can satisfy this service's quorum and still be
        refused by the signer. That is the intended asymmetry: an approver list a
        running system can edit is one an attacker who owns that system can edit,
        and the component holding the private keys must not have one.

        `clientId` is the self-approval control. Leave it null for custodian staff,
        who are independent of every client; set it to a client id for somebody who
        acts for that client, and they will be refused on that client's own
        withdrawals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproverRequest'
      responses:
        '201':
          description: |
            Registered. The response does not echo the public key: it is already
            the caller's, and a registry that reads keys back out is one more way
            to enumerate them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approver'
        '400':
          $ref: '#/components/responses/BadRequest'

  /dev/withdrawals/{withdrawalId}/approve:
    post:
      tags: [dev-withdrawals]
      operationId: simulateApproval
      summary: Approve a withdrawal without collecting any approvals
      description: |
        Moves a `PENDING_APPROVAL` withdrawal to `APPROVED` and writes the
        `WithdrawalApproved` event to the outbox, in one transaction. The relay
        publishes it to `custody.withdrawals.v1` within about half a second.

        Superseded by `POST /v1/withdrawals/{id}/approvals`, which does the real
        thing: Ed25519 signature verification, self-approval rejection and an
        amount-based quorum. This one is kept because it is the only way to
        produce a `WithdrawalApproved` that the signer *should* refuse, and
        "bypassing the approval endpoint does not bypass the approvals" is worth
        being able to demonstrate by hand. It takes no body precisely because it
        checks nothing, and the event it writes carries an empty `approvals` list.

        Mapped only under the `dev` profile. It is the endpoint that would turn a
        request for somebody else's money into an approved one, so in any
        deployment that is not a laptop the bean does not exist and the path
        returns `404`.
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved. The event is queued, and published shortly after.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The withdrawal is not waiting for approval. Approving twice lands
            here: the second call is not a retry of the first, it is a request to
            do something the state machine has no edge for.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A value the client picks once per intended withdrawal and reuses on every
        retry of it — a UUID is the obvious choice. A network timeout does not
        tell the client whether the request arrived, and a blind retry of
        "withdraw 1 ETH" against a chain that cannot reverse a transaction is how
        money disappears. The key is what makes the retry safe.
      schema:
        type: string
        minLength: 8
        maxLength: 255

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: |
        The request is well-formed but cannot be carried out: the address is not
        whitelisted, the account does not exist or does not belong to a client,
        or there is not enough money.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LedgerBusy:
      description: |
        The ledger gave up retrying an optimistic lock conflict. Nothing is wrong;
        the account is busier than the retry budget allows. Retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    WithdrawalRequest:
      type: object
      required: [accountId, destination, amountWei]
      properties:
        accountId:
          type: string
          format: uuid
          description: The client account to debit. Must be a `CLIENT` account.
        destination:
          type: string
          description: |
            Ethereum address, `0x` followed by 40 hex characters. Compared
            case-insensitively against the whitelist, because EIP-55 checksums
            differ only in case and a client should not be punished for sending
            the checksummed form of an address they whitelisted in lower case.
          pattern: '^0x[0-9a-fA-F]{40}$'
          example: '0x70997970c51812dc3a010c7d01b50e0d17dc79c8'
        amountWei:
          $ref: '#/components/schemas/PositiveWei'

    Withdrawal:
      type: object
      required: [id, clientId, accountId, destination, amountWei, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        destination:
          type: string
          example: '0x70997970c51812dc3a010c7d01b50e0d17dc79c8'
        amountWei:
          $ref: '#/components/schemas/PositiveWei'
        status:
          $ref: '#/components/schemas/WithdrawalStatus'
        txHash:
          type: string
          nullable: true
          description: The on-chain transaction hash. Null until the signer broadcasts.
          example: '0x9f2a...'
        confirmations:
          type: integer
          nullable: true
          description: |
            How many blocks, including its own, sit on the transaction's receipt —
            or null while the chain has no receipt for it, which covers "still in
            the mempool", "dropped" and "reorganised out" alike.

            Read from what the watcher last observed rather than from the chain, so
            polling this endpoint does not put a JSON-RPC call behind every request.
            It is therefore up to `chain.poll-interval` out of date, which for a
            number that increments every twelve seconds is not a distinction anybody
            can act on.
          example: 2
        failureReason:
          type: string
          nullable: true
          description: Why the withdrawal ended in `REJECTED` or `FAILED`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WithdrawalStatus:
      type: string
      description: |
        `PENDING_APPROVAL` → `APPROVED` → `BROADCAST` → `CONFIRMED` is the happy
        path. `REJECTED` and `FAILED` release the held funds back to the client;
        `CONFIRMED` settles them against `EXTERNAL`. All three are terminal.
      enum:
        - PENDING_APPROVAL
        - APPROVED
        - BROADCAST
        - CONFIRMED
        - REJECTED
        - FAILED

    Account:
      type: object
      required: [id, type, asset, balanceWei]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
          nullable: true
          description: Null for the system accounts, which belong to nobody.
        type:
          type: string
          enum: [CLIENT, PENDING_OUT, BANK_OPERATING, EXTERNAL]
        asset:
          type: string
          example: ETH
        balanceWei:
          type: string
          description: |
            Signed, because `EXTERNAL` is expected to be negative: it represents
            the outside world, and its negation is what the hot wallet should hold
            on chain.
          pattern: '^-?[0-9]{1,78}$'
          example: '400000000000000000'

    WhitelistRequest:
      type: object
      required: [address]
      properties:
        address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
          example: '0x70997970c51812dc3a010c7d01b50e0d17dc79c8'

    WhitelistEntry:
      type: object
      required: [clientId, address]
      properties:
        clientId:
          type: string
          format: uuid
        address:
          type: string
          description: Stored and returned in lower case, whatever case it arrived in.
          example: '0x70997970c51812dc3a010c7d01b50e0d17dc79c8'

    ApprovalRequest:
      type: object
      required: [approverId, signature]
      properties:
        approverId:
          type: string
          format: uuid
          description: |
            Which approver is signing off. Used to look up the public key the
            signature is checked against — the request does not carry a key, and
            could not usefully: verifying a signature against a key supplied
            alongside it is arithmetic that always succeeds.
        signature:
          $ref: '#/components/schemas/Ed25519Signature'

    Approval:
      type: object
      required: [withdrawalId, approverId, collected, required, status]
      properties:
        withdrawalId:
          type: string
          format: uuid
        approverId:
          type: string
          format: uuid
        collected:
          type: integer
          description: How many distinct approvers have now signed off.
          example: 1
        required:
          type: integer
          description: |
            How many this amount needs. Two at or above the configured four-eyes
            threshold, one below it.
          example: 2
        status:
          $ref: '#/components/schemas/WithdrawalStatus'

    ApproverRequest:
      type: object
      required: [name, publicKey]
      properties:
        name:
          type: string
          description: Who they are, for a human reading an audit trail.
          minLength: 1
          maxLength: 255
          example: alice
        publicKey:
          $ref: '#/components/schemas/Ed25519PublicKey'
        clientId:
          type: string
          format: uuid
          nullable: true
          description: |
            The client this approver acts for, or null for custodian staff. An
            approver with a client set cannot approve that client's own
            withdrawals.

    Approver:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: alice
        clientId:
          type: string
          format: uuid
          nullable: true

    Ed25519PublicKey:
      type: string
      description: |
        A raw Ed25519 public key: the 32 bytes as they travel, base64. Not PEM and
        not an X.509 wrapper — the raw form is what the signer's configuration
        holds and what an approval carries, and one encoding everywhere is one
        fewer place for the two services to disagree about what they are verifying.
      pattern: '^[A-Za-z0-9+/]{43}=$'
      # Deliberately 32 bytes of ASCII rather than a real key. A well-formed
      # example would be forty-four characters of high entropy sitting next to the
      # word "key", which is what a secret scanner is built to find, and teaching
      # people to allowlist the scanner is worse than a less realistic example.
      example: 'bm90LWEtcmVhbC1rZXktLXBsYWNlaG9sZGVyLW9ubHk='

    Ed25519Signature:
      type: string
      description: |
        A raw Ed25519 signature: 64 bytes, base64. The pattern pins the length,
        because a signature of the wrong size is a malformed request rather than a
        failed verification, and the two deserve different status codes.
      pattern: '^[A-Za-z0-9+/]{86}==$'

    Reconciliation:
      type: object
      required: [checkedAt, confirmedChecked, inFlightChecked, agrees, discrepancies]
      properties:
        checkedAt:
          type: string
          format: date-time
        confirmedChecked:
          type: integer
          description: How many settled withdrawals were compared against the chain.
        inFlightChecked:
          type: integer
          description: How many broadcast withdrawals were looked at.
        agrees:
          type: boolean
          description: |
            True when nothing disagreed. Read it together with the counts: a run
            that checked nothing also agrees, and means something else entirely.
        hotWalletBalanceWei:
          type: string
          nullable: true
          description: |
            What the signer's wallet holds on chain, or null if `chain.hot-wallet-address`
            is not configured. Information only — see the operation description.
          pattern: '^[0-9]{1,78}$'
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/Discrepancy'

    Discrepancy:
      type: object
      required: [withdrawalId, kind, detail]
      properties:
        withdrawalId:
          type: string
          format: uuid
        kind:
          type: string
          description: |
            Worst first. The first two mean the ledger has recorded an outflow the
            chain does not support; the third means a settlement's two halves came
            apart; the last is operational — a transaction that has not been mined
            for a long time, which the signer resends but never reprices.
          enum:
            - SETTLED_WITHOUT_A_RECEIPT
            - SETTLED_A_REVERTED_TRANSACTION
            - SETTLED_WITHOUT_A_POSTING
            - BROADCAST_BUT_NOT_MINED
        detail:
          type: string
          description: One sentence for a human. Contains no client data.

    DepositRequest:
      type: object
      required: [clientId, amountWei]
      properties:
        clientId:
          type: string
          format: uuid
        amountWei:
          $ref: '#/components/schemas/PositiveWei'

    PositiveWei:
      type: string
      description: |
        A strictly positive amount of wei, as a decimal integer string with no
        leading zeros. 78 digits is 2^256, the largest value Ethereum can hold.
      pattern: '^[1-9][0-9]{0,77}$'
      example: '400000000000000000'

    Problem:
      type: object
      description: |
        RFC 9457 Problem Details, plus a `code`. The code is what a client should
        branch on: `status` is too coarse (three different things return 422) and
        `detail` is prose meant for a human reading a log.
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Insufficient funds
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: the account does not hold enough to cover this withdrawal
        instance:
          type: string
          format: uri
        code:
          type: string
          example: INSUFFICIENT_FUNDS
        errors:
          type: array
          description: Field-level validation failures, present only on a 400.
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
