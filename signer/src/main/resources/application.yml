spring:
  application:
    name: signer

  datasource:
    # Its own database — the signer must not be able to read custody tables.
    url: jdbc:postgresql://localhost:5432/signer
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: signer
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true

# The signer has no signing endpoint, and with no web starter on the classpath
# it has no HTTP server at all. Actuator is still worth having for its health
# indicators, which a container runtime can read from the JMX endpoint or from
# a sidecar; the port below only takes effect if a web starter is ever added,
# and is kept off 8080 so both services can run on one laptop.
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true

chain:
  rpc-url: http://localhost:8545
  # Anvil. Signed into every transaction (EIP-155), so a transaction signed here
  # cannot be replayed on a chain where the same address holds real money.
  chain-id: 31337

signer:
  # Stand-in for a KMS or HSM. Read from the environment so it never lands in
  # git; a real deployment would fetch it from a vault at startup, and the key
  # itself would never leave the HSM at all.
  master-key: ${SIGNER_MASTER_KEY:}

  hot-wallet:
    # The one address this service signs from. Authoritative: the imported key
    # has to derive to it, so a key from the wrong environment fails at startup
    # rather than quietly moving funds out of a wallet nobody reconciles.
    address: ${SIGNER_HOT_WALLET_ADDRESS:}
    # Only needed on the first boot of a fresh database. Once the key is sealed
    # in wallet_keys, remove it from the environment: after that it is a copy of
    # a secret with no reader.
    import-private-key: ${SIGNER_HOT_WALLET_PRIVATE_KEY:}

  policy:
    # The hot-wallet cap. A hot wallet is online and automated by definition, so
    # this number is what an attacker who owns everything upstream gets per
    # transaction. Anything larger is a warm-wallet operation with a human in it.
    max-transaction-wei: "5000000000000000000" # 5 ETH
    # Four eyes from 1 ETH up; one approver below it. A rule expensive enough to
    # be routinely worked around protects nothing, so the expensive rule is kept
    # for the amounts that justify it.
    second-approval-from-wei: "1000000000000000000" # 1 ETH
    # Every approver this service will accept a signature from, by id and raw
    # Ed25519 public key. Same number as custody-api's `second-approval-from-wei`
    # above it, and see ADR 0010 for why that duplication is the security model.
    #
    # Empty here, and empty means this service refuses every withdrawal. That is
    # the correct default rather than a gap: custody-api keeps its approvers in a
    # table that can be added to at runtime, and if this list were derived from
    # that one then owning custody-api would be enough to move funds. This list
    # arrives with the deployment instead, so filling it in is a deliberate act by
    # whoever deploys the signer. The README shows it being set from the
    # environment for a local run.
    trusted-approvers: []

  broadcast:
    # How long after signing a transaction may be considered lost. Longer than
    # the listener's own broadcast takes, so the retry job and the listener
    # never race to send the same bytes.
    retry-after: 10s
    retry-interval: 5s
