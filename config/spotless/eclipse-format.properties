# Eclipse JDT formatter settings, applied by Spotless on top of Eclipse's
# defaults. Only the overrides are listed; everything absent is the default.
#
# Why Eclipse JDT and not google-java-format or palantir-java-format: both of
# those reach into `com.sun.tools.javac.tree` internals that JDK 25 no longer
# exposes, and neither runs on this project's toolchain. Eclipse JDT has its
# own parser, so it is unaffected.
#
# The policy is: the formatter owns the code completely, and does not touch
# comments at all. Code formatting is fully canonical — one input has exactly
# one correct output, so "is this formatted right" is never a matter of taste.
# Prose is left alone, because in a codebase this heavily commented a formatter
# with opinions about paragraphs destroys more than it fixes.
#
# Achieving that with Eclipse JDT takes a handful of non-obvious settings; see
# the wrapping section below.

# ---- Indentation: four spaces, never tabs -----------------------------------
org.eclipse.jdt.core.formatter.tabulation.char=space
org.eclipse.jdt.core.formatter.tabulation.size=4
org.eclipse.jdt.core.formatter.indentation.size=4
org.eclipse.jdt.core.formatter.continuation_indentation=2
org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=2
org.eclipse.jdt.core.formatter.use_tabs_only_for_leading_indentations=false
org.eclipse.jdt.core.formatter.indent_switchstatements_compare_to_switch=true
org.eclipse.jdt.core.formatter.indent_switchstatements_compare_to_cases=true

# ---- Line width -------------------------------------------------------------
# 120, not 80: fully-qualified Spring types and Testcontainers generics do not
# fit in 80 without wrapping that hurts more than it helps.
org.eclipse.jdt.core.formatter.lineSplit=120
org.eclipse.jdt.core.formatter.comment.line_length=100

# ---- Wrapping: the settings that matter -------------------------------------
# `join_wrapped_lines` is what makes the formatting canonical: the formatter
# rebuilds every line break itself rather than preserving whatever the author
# happened to type, so two people writing the same code get the same bytes.
org.eclipse.jdt.core.formatter.join_wrapped_lines=true
org.eclipse.jdt.core.formatter.join_lines_in_comments=false

# Eclipse's default wrapping is greedy: when an argument list does not fit it
# packs as many arguments per line as will squeeze in, which turns a readable
# one-per-line list into a ragged block. `48` is M_ONE_PER_LINE_SPLIT — if the
# call has to wrap at all, every argument gets its own line. That is what
# google-java-format and palantir-java-format do, and it is the reason their
# output is pleasant to read while stock Eclipse output is not.
#
# With these set, the formatter reproduces the hand-written palantir-style
# formatting of the sources byte for byte.
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_method_invocation=48
org.eclipse.jdt.core.formatter.alignment_for_parameters_in_method_declaration=48
# `new Foo(...)` is an allocation expression, not a method invocation, and has
# its own key. Without it a wrapped constructor call packs greedily while the
# method call two lines above it does not, which looks like a mistake.
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_allocation_expression=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_explicit_constructor_call=48

# Method chains are the exception, and `80` (M_NEXT_PER_LINE_SPLIT) rather than
# `48` is why. One-per-line counts the receiver as an element, so a wrapped
# `jdbc.sql(...).param(...)` comes out starting with a line holding nothing but
# `jdbc`, and `List.of(a, b)` becomes `List` then `.of(a, b)`. `80` keeps the
# first segment attached to the receiver and gives every later `.selector()` its
# own line, which is what google-java-format does and what the JdbcClient code
# in the ledger is written to read like.
org.eclipse.jdt.core.formatter.alignment_for_selector_in_method_invocation=80
org.eclipse.jdt.core.formatter.never_indent_block_comments_on_first_column=true
org.eclipse.jdt.core.formatter.never_indent_line_comments_on_first_column=true

# ---- Comments are the author's, not the formatter's -------------------------
org.eclipse.jdt.core.formatter.comment.format_javadoc_comments=false
org.eclipse.jdt.core.formatter.comment.format_block_comments=false
org.eclipse.jdt.core.formatter.comment.format_line_comments=false
org.eclipse.jdt.core.formatter.comment.format_header=false
org.eclipse.jdt.core.formatter.comment.clear_blank_lines_in_javadoc_comment=false
org.eclipse.jdt.core.formatter.comment.clear_blank_lines_in_block_comment=false
org.eclipse.jdt.core.formatter.comment.indent_parameter_description=false
org.eclipse.jdt.core.formatter.comment.new_lines_at_javadoc_boundaries=false

# ---- Braces -----------------------------------------------------------------
# K&R throughout, and braces are never omitted (Checkstyle's NeedBraces agrees).
org.eclipse.jdt.core.formatter.brace_position_for_type_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_method_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_constructor_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_block=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_switch=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_lambda_body=end_of_line
org.eclipse.jdt.core.formatter.keep_simple_if_on_one_line=false
org.eclipse.jdt.core.formatter.keep_then_statement_on_same_line=false
org.eclipse.jdt.core.formatter.keep_else_statement_on_same_line=false

# ---- Spacing ----------------------------------------------------------------
org.eclipse.jdt.core.formatter.insert_space_before_opening_brace_in_array_initializer=insert
org.eclipse.jdt.core.formatter.insert_space_after_opening_brace_in_array_initializer=do not insert
org.eclipse.jdt.core.formatter.insert_space_before_closing_brace_in_array_initializer=do not insert

# ---- Blank lines ------------------------------------------------------------
org.eclipse.jdt.core.formatter.blank_lines_before_package=0
org.eclipse.jdt.core.formatter.blank_lines_after_package=1
org.eclipse.jdt.core.formatter.blank_lines_before_imports=1
org.eclipse.jdt.core.formatter.blank_lines_after_imports=1
org.eclipse.jdt.core.formatter.number_of_empty_lines_to_preserve=1
org.eclipse.jdt.core.formatter.blank_lines_before_first_class_body_declaration=1

# ---- Annotations on their own line ------------------------------------------
# `@Test`, `@Transactional` and friends read better stacked above the member
# than inline with it. Parameter annotations stay inline.
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_type=insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_method=insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_field=insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_parameter=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_after_type_annotation=do not insert

# ---- Empty bodies -----------------------------------------------------------
# `protected Account() {}` and `private record Row(...) {}` read as one thing.
# Spreading an empty body over three lines makes the reader check whether
# something was meant to go in it.
org.eclipse.jdt.core.formatter.keep_method_body_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_type_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_record_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_record_constructor_on_one_line=one_line_if_empty

# Annotation arguments default to never wrapping, so a long
# `@SuppressFBWarnings(value = …, justification = …)` runs past the line limit
# and the formatter leaves it there. One per line when it does not fit.
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_annotation=48
